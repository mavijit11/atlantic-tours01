<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092f3b">
  <title>Ask Atlantic | Atlantic Coast Tours</title>
  <style>
    :root {
      --navy: #092f3b;
      --teal: #087f8c;
      --seafoam: #dff5f0;
      --sand: #f7f3e9;
      --ink: #18343b;
      --muted: #6b858a;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(99, 197, 183, .24), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(230, 194, 137, .24), transparent 32%),
        #edf5f3;
    }

    .app {
      width: min(100%, 760px);
      height: min(850px, calc(100vh - 36px));
      min-height: 560px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(9, 47, 59, .10);
      border-radius: 24px;
      background: var(--white);
      box-shadow: 0 22px 70px rgba(9, 47, 59, .14);
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 24px;
      color: white;
      background: linear-gradient(125deg, #092f3b, #087f8c);
    }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 15px;
      background: rgba(255,255,255,.15);
      font-size: 24px;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -.02em;
    }

    header p {
      margin: 4px 0 0;
      color: rgba(255,255,255,.76);
      font-size: .88rem;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      font-size: .75rem;
      color: #d7f7eb;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #75e5b8;
      box-shadow: 0 0 0 4px rgba(117,229,184,.15);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      background: linear-gradient(180deg, #fbfdfc, #f5faf8);
    }

    .message {
      max-width: 86%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: appear .18s ease-out;
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; }

    .bubble {
      padding: 13px 16px;
      border-radius: 18px;
      font-size: .96rem;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot .bubble {
      border: 1px solid #e1eeeb;
      border-bottom-left-radius: 5px;
      background: white;
      color: var(--ink);
      box-shadow: 0 3px 12px rgba(9,47,59,.04);
    }

    .user .bubble {
      border-bottom-right-radius: 5px;
      background: var(--teal);
      color: white;
    }

    .timestamp {
      padding: 0 5px;
      color: var(--muted);
      font-size: .72rem;
    }

    .user .timestamp { text-align: right; }

    .thinking .bubble {
      color: #5f7c81;
      font-style: italic;
    }

    .dots::after {
      content: "";
      display: inline-block;
      width: 1.2em;
      animation: dots 1.2s steps(4, end) infinite;
      content: "…";
    }

    footer {
      padding: 16px;
      border-top: 1px solid #e5efed;
      background: white;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #d8e7e4;
      border-radius: 14px;
      outline: none;
      background: #f8fbfa;
      color: var(--ink);
      font: inherit;
    }

    input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(8,127,140,.12);
    }

    button {
      padding: 0 20px;
      border: 0;
      border-radius: 14px;
      background: var(--teal);
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    button:hover { background: #066a75; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: wait; }

    .hint {
      margin: 9px 4px 0;
      color: var(--muted);
      font-size: .75rem;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }

    @media (max-width: 520px) {
      body { padding: 0; }
      .app {
        height: 100vh;
        min-height: 0;
        border: 0;
        border-radius: 0;
      }
      header { padding: 18px; }
      #chat { padding: 18px 14px; }
      footer { padding: 12px; }
      .message { max-width: 92%; }
      button { padding: 0 16px; }
      .status { font-size: .68rem; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">🌊</div>
      <div>
        <h1>Ask Atlantic</h1>
        <p>Atlantic Coast Tours · West of Ireland</p>
      </div>
      <div class="status"><span class="status-dot"></span> Live catalogue</div>
    </header>

    <section id="chat" aria-live="polite" aria-label="Chat messages">
      <div class="message bot">
        <div class="bubble">Hello! Welcome to Ask Atlantic. 🌿 Ask me about our tours, prices, or availability along Ireland’s Atlantic coast.</div>
      </div>
    </section>

    <footer>
      <form id="chat-form">
        <input id="question" type="text" placeholder="Ask about tours, prices, or availability…" autocomplete="off" required aria-label="Your question">
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">I check the live tour catalogue whenever you ask.</p>
    </footer>
  </main>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";
    const CHAT_URL = "https://luas-class.kluxy.app/chat";

    const SYSTEM = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const sendButton = document.getElementById("send");

    function addMessage(text, role = "bot", extra = "") {
      const message = document.createElement("div");
      message.className = `message ${role}${extra ? " " + extra : ""}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(bubble);

      if (role === "bot" && extra !== "thinking") {
        const timestamp = document.createElement("div");
        timestamp.className = "timestamp";
        timestamp.textContent = `Data fetched live at ${new Date().toLocaleTimeString("en-IE", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        })}`;
        message.appendChild(timestamp);
      }

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
      return message;
    }

    async function ask(question) {
      const thinking = addMessage("Thinking", "bot", "thinking");
      thinking.querySelector(".bubble").classList.add("dots");
      sendButton.disabled = true;
      input.disabled = true;

      try {
        // Fetch the latest catalogue for every customer question.
        const csvResponse = await fetch(CSV_URL, { cache: "no-store" });
        if (!csvResponse.ok) {
          throw new Error(`Could not fetch tour catalogue (HTTP ${csvResponse.status}).`);
        }
        const csv = await csvResponse.text();

        const response = await fetch(CHAT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system: SYSTEM,
            messages: [{
              role: "user",
              content: "Live data (CSV):\n" + csv + "\n\nCustomer question: " + question
            }]
          })
        });

        if (!response.ok) {
          const details = await response.text().catch(() => "");
          throw new Error(`Chat service returned HTTP ${response.status}${details ? ": " + details : ""}`);
        }

        const data = await response.json();
        if (typeof data.reply !== "string") {
          throw new Error('The chat service response did not contain a valid "reply" field.');
        }

        thinking.remove();
        addMessage(data.reply, "bot");
      } catch (error) {
        thinking.remove();
        addMessage(`Sorry, something went wrong: ${error.message || String(error)}`, "bot");
      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || sendButton.disabled) return;

      addMessage(question, "user");
      input.value = "";
      await ask(question);
    });
  </script>
</body>
</html>
