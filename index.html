<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Atlantic | Atlantic Coast Tours</title>

  <style>
    :root {
      --navy: #102b3f;
      --navy-light: #1d4055;
      --seafoam: #b8e3d4;
      --green: #357b68;
      --background: #f4f8f7;
      --white: #ffffff;
      --text: #203746;
      --muted: #84939c;
      --border: #e4ece9;
      --shadow: 0 20px 60px rgba(16, 43, 63, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #e1f1eb, transparent 45%),
        var(--background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: min(850px, 92vh);
      min-height: 560px;
      background: var(--white);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(16, 43, 63, 0.06);
    }

    /* Header */

    .header {
      background: var(--navy);
      color: white;
      padding: 25px 28px;
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(184, 227, 212, 0.08);
      right: -50px;
      top: -100px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--seafoam);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      flex-shrink: 0;
    }

    .header-text {
      flex: 1;
      min-width: 0;
    }

    .header h1 {
      font-size: 21px;
      letter-spacing: -0.5px;
      font-weight: 750;
    }

    .header p {
      color: #c3d6df;
      font-size: 12px;
      margin-top: 4px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #d8f2e8;
      white-space: nowrap;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      background: #75d6a8;
      border-radius: 50%;
      box-shadow: 0 0 10px #75d6a8;
    }

    /* Chat */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      padding: 10px 10px 20px;
    }

    .welcome .wave {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .welcome h2 {
      font-size: 23px;
      color: var(--navy);
      letter-spacing: -0.6px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #778992;
      font-size: 13px;
      line-height: 1.6;
      max-width: 400px;
      margin: auto;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 18px;
    }

    .suggestion {
      border: 1px solid var(--border);
      background: #f8fbfa;
      color: var(--navy);
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .suggestion:hover {
      background: var(--seafoam);
      border-color: var(--seafoam);
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: appear 0.25s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 14px 17px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: var(--navy);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bot .bubble {
      background: #f0f7f4;
      color: var(--text);
      border: 1px solid #e5efeb;
      border-bottom-left-radius: 5px;
    }

    .bot .bubble.error {
      background: #fff1f0;
      color: #9c3029;
      border-color: #f4d2cf;
    }

    .meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      padding: 0 4px;
    }

    .thinking {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 17px 20px;
    }

    .thinking span {
      width: 7px;
      height: 7px;
      background: #7ba99a;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .thinking span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* Input */

    .input-area {
      padding: 18px 22px 20px;
      background: #ffffff;
      border-top: 1px solid var(--border);
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      background: #f5f9f8;
      border: 1px solid #e1ebe7;
      border-radius: 17px;
      padding: 6px;
      transition: 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: #8dc6b2;
      box-shadow: 0 0 0 3px rgba(141, 198, 178, 0.15);
    }

    input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      padding: 12px 13px;
      font-size: 14px;
      color: var(--text);
    }

    input::placeholder {
      color: #9aa9af;
    }

    button.send {
      border: none;
      background: var(--navy);
      color: white;
      border-radius: 12px;
      padding: 0 22px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }

    button.send:hover {
      background: var(--navy-light);
      transform: translateY(-1px);
    }

    button.send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .footer-note {
      text-align: center;
      font-size: 10px;
      color: #a0adb2;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
        background: white;
      }

      .app {
        height: 100dvh;
        min-height: 0;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      .header {
        padding: 19px 18px;
      }

      .header h1 {
        font-size: 19px;
      }

      .online {
        font-size: 10px;
      }

      .chat {
        padding: 20px 16px;
      }

      .message {
        max-width: 92%;
      }

      .input-area {
        padding: 12px 14px 15px;
      }

      button.send {
        padding: 0 18px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">🌊</div>

      <div class="header-text">
        <h1>Ask Atlantic</h1>
        <p>Atlantic Coast Tours · West of Ireland</p>
      </div>

      <div class="online">
        <span class="online-dot"></span>
        Live assistant
      </div>
    </header>

    <main class="chat" id="chat">

      <div class="welcome" id="welcome">
        <div class="wave">☘️</div>
        <h2>Discover the wild Atlantic.</h2>
        <p>
          Your local travel companion for unforgettable adventures
          along Ireland’s spectacular west coast.
        </p>

        <div class="suggestions">
          <button class="suggestion"
            onclick="askSuggestion('What tours are available?')">
            Explore tours
          </button>

          <button class="suggestion"
            onclick="askSuggestion('What is the cheapest tour?')">
            Cheapest tour
          </button>

          <button class="suggestion"
            onclick="askSuggestion('How many slots are left?')">
            Check availability
          </button>
        </div>
      </div>

    </main>

    <form class="input-area" id="chatForm">
      <div class="input-wrapper">
        <input
          id="question"
          type="text"
          placeholder="Ask about tours, prices or availability..."
          autocomplete="off"
          required
        >

        <button class="send" id="sendButton" type="submit">
          Send ↗
        </button>
      </div>

      <div class="footer-note">
        Powered by live tour information · Atlantic Coast Tours
      </div>
    </form>

  </div>

  <script>
    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";

    const BRAIN_URL =
      "https://luas-class.kluxy.app/chat";

    const SYSTEM =
      "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const sendButton = document.getElementById("sendButton");
    const welcome = document.getElementById("welcome");

    function addMessage(text, type, meta = "", isError = false) {
      const message = document.createElement("div");
      message.className = `message ${type}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (isError) {
        bubble.classList.add("error");
      }

      // Use textContent to avoid interpreting user or API text as HTML.
      bubble.textContent = text;

      message.appendChild(bubble);

      if (meta) {
        const metadata = document.createElement("div");
        metadata.className = "meta";
        metadata.textContent = meta;
        message.appendChild(metadata);
      }

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    function addThinking() {
      const message = document.createElement("div");
      message.className = "message bot";
      message.id = "thinkingMessage";

      const bubble = document.createElement("div");
      bubble.className = "bubble thinking";

      bubble.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
      `;

      message.appendChild(bubble);

      const metadata = document.createElement("div");
      metadata.className = "meta";
      metadata.textContent = "Thinking...";
      message.appendChild(metadata);

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeThinking() {
      const thinking = document.getElementById("thinkingMessage");
      if (thinking) thinking.remove();
    }

    function getTime() {
      return new Date().toLocaleTimeString("en-IE", {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    async function sendQuestion(question) {
      question = question.trim();

      if (!question) return;

      welcome.style.display = "none";

      addMessage(question, "user");

      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;

      addThinking();

      try {
        // STEP 1: Fetch the LIVE CSV for every question.
        const csvResponse = await fetch(CSV_URL, {
          cache: "no-store"
        });

        if (!csvResponse.ok) {
          throw new Error(
            `Tour catalogue fetch failed: HTTP ${csvResponse.status}`
          );
        }

        const csv = await csvResponse.text();

        if (!csv.trim()) {
          throw new Error("The live tour catalogue is empty.");
        }

        // STEP 2: Send the question and live CSV to the class brain.
        const brainResponse = await fetch(BRAIN_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            system: SYSTEM,

            messages: [
              {
                role: "user",

                content:
                  "Live data (CSV):\n" +
                  csv +
                  "\n\nCustomer question: " +
                  question
              }
            ]
          })
        });

        if (!brainResponse.ok) {
          throw new Error(
            `Assistant request failed: HTTP ${brainResponse.status}`
          );
        }

        const data = await brainResponse.json();

        // STEP 3: Display the JSON reply.
        if (typeof data.reply !== "string") {
          throw new Error(
            "The assistant response did not contain a valid reply field."
          );
        }

        removeThinking();

        addMessage(
          data.reply,
          "bot",
          "Data fetched live at " + getTime()
        );

      } catch (error) {
        removeThinking();

        addMessage(
          "Sorry, something went wrong: " +
          (error.message || String(error)),
          "bot",
          "Please try again.",
          true
        );

        console.error("Ask Atlantic error:", error);

      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      sendQuestion(input.value);
    });

    function askSuggestion(question) {
      sendQuestion(question);
    }
  </script>

</body>
</html>
